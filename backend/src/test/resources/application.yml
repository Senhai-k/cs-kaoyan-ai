spring:
  datasource:
    url: jdbc:h2:mem:kaoyan-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=YEAR;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema-h2.sql
      data-locations: classpath:data-h2.sql
  flyway:
    enabled: false

app:
  admin:
    password: test-admin-password
  ai:
    provider: local
    agent:
      internal-token: test-agent-token
