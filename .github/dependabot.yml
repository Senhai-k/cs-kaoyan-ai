version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: monthly
    labels: [dependencies, backend]
    groups:
      backend-dependencies:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    labels: [dependencies, frontend]
    groups:
      frontend-dependencies:
        patterns: ['*']

  - package-ecosystem: pip
    directory: /agent-service
    schedule:
      interval: monthly
    labels: [dependencies, agent]
    groups:
      agent-dependencies:
        patterns: ['*']
